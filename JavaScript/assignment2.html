<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bus Booking</title>
</head>
<style>
    *{
        padding: 0;
        margin: 0;
    }
    .container{
        display: flex;
        justify-content: center;
        flex-direction: column;
        align-items: center;
        background-color: cornflowerblue;
        border: 2px solid black;
        border-radius: 20px;
        padding: 10px;
        width: fit-content;
    }
    .heading{
        display: flex;
        flex-direction: row;
    }
</style>
<body>
    <div class="container">
         <div class="heading">
            <img src="" alt="Nahi hai logo"> 
            <h1>Bus Booking System</h1>
        </div>
    <div class="user">
       <h3>User Info</h3>
       <form action="">
           <label for=".name">Name</label>
           <input type="text" placeholder="enter name" class="name"></input>
           <br>
           <label for=".age">Age</label>
           <input type="text" placeholder="enter age" class="age"></input>
           <br>
           <label for=".no">Phone number</label>
           <input type="text" placeholder="enter phone number" class="no"></input>
           <br>
           <label for=".city">City</label>
           <input type="text" placeholder="enter city name" class="city"></input>
           <br>
           <label for=".date">Date</label>
           <input type="date" placeholder="enter date" class="date"></input>
           <br>
       </form>   
    </div>

    <div class="bus">
       <h3>Bus Info</h3>
       <p>Select bus type</p>
       <form action=""> 
           <label for="bustype">Bus Type:</label>       
           <input type="radio" name="bustype" value="ac">AC (Rs.2000)</input>
           <input type="radio" name="bustype" value="non">Non AC (Rs.1500)</input>
           <br>
           <label for="seat">No. of seats</label>
           <select name="seat" id="">
             <option value="">1</option>
             <option value="">2</option>
             <option value="">3</option>
             <option value="">4</option>
           </select>
       </form>  
       <button>Book Now</button> 
    </div>

    
    </div>
    
    
</body>
</html>
